      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
      - ./kagome.yaml:/kagome.yaml:ro
      - ./kagome.crypto.yaml:/kagome.crypto.yaml:ro
    command: run /scripts/code-chain.k6.js
    profiles:
      - loadtest

