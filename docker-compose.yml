services:
  kagome:
    build:
      context: .
      args:
        KAGOME_UID: ${KAGOME_UID:-1000}
        KAGOME_GID: ${KAGOME_GID:-1000}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      KAGOME_SSH_PUBLIC_KEY: ${KAGOME_SSH_PUBLIC_KEY:-}
      KAGOME_AGENT_SSH_ENABLED: ${KAGOME_AGENT_SSH_ENABLED:-0}
    tmpfs:
      - /run/kagome-ssh:uid=${KAGOME_UID:-1000},gid=${KAGOME_GID:-1000},mode=0700
    volumes:
      - kagome_home:/home/kagome
      - kagome_ssh:/home/kagome/.ssh
    secrets:
      - source: kagome_config
        target: kagome.yaml
      - source: kagome_crypto
        target: kagome.crypto.yaml
      - source: kagome_passwords
        target: kagome.htpasswd.example
    ports:
      - "${KAGOME_PORT:-4000}:${KAGOME_PORT:-4000}"
      - "${KAGOME_SSH_BIND:-127.0.0.1}:${KAGOME_SSH_PORT:-2222}:2222"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:${KAGOME_PORT:-4000}/echo",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  agent-chat:
    image: python:3.13-slim
    init: true
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_SERVER_TARGET: ${KAGOME_SERVER_TARGET:-http://kagome:4000}
      KAGOME_PUBLIC_HOST: ${KAGOME_PUBLIC_HOST:-agent-chat.local:4000}
      KAGOME_REDIRECT_URI: ${KAGOME_REDIRECT_URI:-https://client.example.com/callback}
      KAGOME_USERNAME: ${KAGOME_USERNAME:-username}
      KAGOME_PASSWORD: ${KAGOME_PASSWORD:-password}
      KAGOME_TIMEOUT: ${KAGOME_TIMEOUT:-5}
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts:ro
    command: python agent_chat.py
    profiles:
      - tools

  k6-client-credentials:
    image: grafana/k6:latest
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_TOKEN_TARGET: ${KAGOME_TOKEN_TARGET:-http://kagome:4000/token}
      KAGOME_CLIENT_ID: ${KAGOME_CLIENT_ID:-client_id}
      KAGOME_CLIENT_SECRET: ${KAGOME_CLIENT_SECRET:-client_secret}
      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
    command: run /scripts/client-credentials.k6.js
    profiles:
      - loadtest

  k6-code-chain:
    image: grafana/k6:latest
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_SERVER_TARGET: ${KAGOME_SERVER_TARGET:-http://kagome:4000}
      KAGOME_TOKEN_TARGET: ${KAGOME_TOKEN_TARGET:-http://kagome:4000/token}
      KAGOME_PUBLIC_HOST: ${KAGOME_PUBLIC_HOST:-localhost:4000}
      KAGOME_REDIRECT_URI: ${KAGOME_REDIRECT_URI:-https://client.example.com/callback}
      KAGOME_USERNAME: ${KAGOME_USERNAME:-username}
      KAGOME_PASSWORD: ${KAGOME_PASSWORD:-password}
      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
      - ./kagome.yaml:/kagome.yaml:ro
      - ./kagome.crypto.yaml:/kagome.crypto.yaml:ro
    command: run /scripts/code-chain.k6.js
    profiles:
      - loadtest

  k6-authorization-code:
    image: grafana/k6:latest
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_SERVER_TARGET: ${KAGOME_SERVER_TARGET:-http://kagome:4000}
      KAGOME_TOKEN_TARGET: ${KAGOME_TOKEN_TARGET:-http://kagome:4000/token}
      KAGOME_PUBLIC_HOST: ${KAGOME_PUBLIC_HOST:-localhost:4000}
      KAGOME_REDIRECT_URI: ${KAGOME_REDIRECT_URI:-https://client.example.com/callback}
      KAGOME_USERNAME: ${KAGOME_USERNAME:-username}
      KAGOME_PASSWORD: ${KAGOME_PASSWORD:-password}
      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
    command: run /scripts/authorization-code.k6.js
    profiles:
      - loadtest

  k6-resource-owner-password:
    image: grafana/k6:latest
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_SERVER_TARGET: ${KAGOME_SERVER_TARGET:-http://kagome:4000}
      KAGOME_CLIENT_ID: ${KAGOME_CLIENT_ID:-client_id}
      KAGOME_CLIENT_SECRET: ${KAGOME_CLIENT_SECRET:-client_secret}
      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
    command: run /scripts/resource-owner-password.k6.js
    profiles:
      - loadtest

  k6-implicit:
    image: grafana/k6:latest
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_SERVER_TARGET: ${KAGOME_SERVER_TARGET:-http://kagome:4000}
      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
    command: run /scripts/implicit.k6.js
    profiles:
      - loadtest

  k6-pre-authorized-code:
    image: grafana/k6:latest
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_SERVER_TARGET: ${KAGOME_SERVER_TARGET:-http://kagome:4000}
      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
    command: run /scripts/pre-authorized-code.k6.js
    profiles:
      - loadtest

  k6-siopv2:
    image: grafana/k6:latest
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_SERVER_TARGET: ${KAGOME_SERVER_TARGET:-http://kagome:4000}
      KAGOME_CLIENT_ID: ${KAGOME_CLIENT_ID:-client_id}
      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
    command: run /scripts/siopv2.k6.js
    profiles:
      - loadtest

  k6-openid4vp:
    image: grafana/k6:latest
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_SERVER_TARGET: ${KAGOME_SERVER_TARGET:-http://kagome:4000}
      KAGOME_CLIENT_ID: ${KAGOME_CLIENT_ID:-client_id}
      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
    command: run /scripts/openid4vp.k6.js
    profiles:
      - loadtest

volumes:
  kagome_home:
  kagome_ssh:

secrets:
  kagome_config:
    file: ./kagome.yaml
  kagome_crypto:
    file: ./kagome.crypto.yaml
  kagome_passwords:
    file: ./kagome.htpasswd.example
