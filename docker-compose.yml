services:
  kagome:
    build: .
    init: true
    ports:
      - "${KAGOME_PORT:-4000}:${KAGOME_PORT:-4000}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:${KAGOME_PORT:-4000}/echo",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  k6-client-credentials:
    image: grafana/k6:latest
    depends_on:
      kagome:
        condition: service_healthy
    environment:
      KAGOME_TOKEN_TARGET: ${KAGOME_TOKEN_TARGET:-http://kagome:4000/token}
      KAGOME_CLIENT_ID: ${KAGOME_CLIENT_ID:-client_id}
      KAGOME_CLIENT_SECRET: ${KAGOME_CLIENT_SECRET:-client_secret}
      K6_VUS: ${K6_VUS:-4}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scripts:/scripts:ro
    command: run /scripts/client-credentials.k6.js
    profiles:
      - loadtest

  k6-code-chain:
    image: grafana/k6:latest
