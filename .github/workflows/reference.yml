name: publish reference documentation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: build reference documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --package kagome

      - name: add documentation root redirect
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=kagome/index.html">
              <title>Kagome documentation</title>
            </head>
            <body>
              <a href="kagome/index.html">Kagome documentation</a>
            </body>
          </html>
          HTML

      - name: upload documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: configure github pages
        uses: actions/configure-pages@v6

      - name: publish documentation
        id: deployment
        uses: actions/deploy-pages@v4
