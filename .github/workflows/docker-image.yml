name: docker image

on:
  push:
    tags:
      - "**"

jobs:
  build:
    name: build docker image
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: verify tag is on echo branch
        run: |
          git fetch origin echo
          git merge-base --is-ancestor "$GITHUB_SHA" origin/echo

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: kagome:${{ github.ref_name }}
