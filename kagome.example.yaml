# yaml-language-server: $schema=./kagome.schema.json
server:
  address: 0.0.0.0:4000
  issuer: http://localhost:4000
  workers: 4
  cors_origins:
    - "*"
  replay_protection: 100000
  rate_limit:
    count: 10
    time_unit: second
    penality: 500
    timeout: 5000
    memory_length: 50
crypto:
  key_file: kagome.crypto.yaml
# Optional. Trust an issuer through inline public keys or an HTTPS JWKS endpoint.
# For local testing, use the public YAML from scripts/generate-agent-provider-key.py.
# For remote keys, set jwks_uri to the provider's HTTPS JWKS URL.
# agent_providers:
#   - issuer: https://agents.example
#     jwks:
#       keys:
#         - kid: provider-key-1
#           alg: Ed25519
#           kty: OKP
#           crv: Ed25519
#           x: "<provider's base64url public key>"
# Optional. Records provider-attested agent public keys in an existing directory.
# agent_key_file: ./kagome.agent-keys.json
# Optional. Set KAGOME_AGENT_SSH_ENABLED=1 in Docker Compose to enable SSH.
# Match the issuer to a trusted provider and the subject to its agent token.
# A signed POST /agent/resource can request both scopes with
# SSH-Scope: resource:read resource:write
# ssh_resource:
#   issuer: https://agents.example
#   subject: "aauth:assistant@agents.example"
#   host: 127.0.0.1
#   port: 2222
#   scopes:
#     resource:read:
#       - name: status
#         executable: /bin/hostname
#       - name: details
#         executable: /bin/uname
#       - name: ls
#         executable: /bin/ls
#         allowed_args: [[], ["-a"], ["-l"]]
#       - name: pwd
#         executable: /bin/pwd
#     resource:write:
#       - name: tee
#         executable: /usr/bin/tee
#         allowed_args: [["/home/kagome/test.txt"]]
#         allow_stdin: true
#   state_directory: /run/kagome-ssh
tokens:
  access_token_ttl: 3600
  authorization_code_ttl: 600
  id_token_ttl: 3600
  pre_authorized_code_ttl: 300
  federation_state_ttl: 300
  presentation_state_ttl: 300
  siopv2_state_ttl: 300
  authorization_code_chain_max_depth: 8
credentials:
  - credential_configuration_id: UniversityDegreeCredential
    name: University Degree Credential
    vct: UniversityDegreeCredential
    type:
      - UniversityDegreeCredential
presentation_definitions:
  - identifier: credential_presentation
    definition:
      id: credential_presentation
      input_descriptors:
        - id: credential
          format:
            jwt_vc:
              alg: [EdDSA]
          constraints:
            fields:
              - path: [$.vc.type]
                filter:
                  type: array
                  contains:
                    const: UniversityDegreeCredential
              - path: [$.vc.credentialSubject.id]
clients:
  - client_id: client_id
    public: localhost:4000
    password_file: kagome.htpasswd.example
    client_secret: client_secret
    redirect_uris:
      - https://client.example.com/callback
    supported_grant_types:
      - authorization_code
      - client_credentials
      - code_chain
      - implicit
      - urn:ietf:params:oauth:grant-type:pre-authorized_code
      - password
    supported_response_types:
      - code
      - id_token
      - urn:ietf:params:oauth:response-type:pre-authorized_code
      - token
      - vp_token
    scopes:
      - openid
      - profile
      - credential_presentation
    require_wallet_binding: false
    qr_code: false
    federated_server:
      client_id: kagome
      client_secret: federated_client_secret
      authorize_endpoint: https://identity.example.com/authorize
      token_endpoint: https://identity.example.com/token
      scope: openid profile
      endpoints:
        - endpoint: https://identity.example.com/userinfo
          claims:
            - claim: sub
              target: sub
              id_token: false
              credential: [UniversityDegreeCredential]
  - client_id: agent_chat
    public: agent-chat.local:4000
    password_file: kagome.htpasswd.example
    client_secret: unused_by_public_code_chain
    redirect_uris:
      - https://client.example.com/callback
    supported_grant_types:
      - authorization_code
      - code_chain
      - implicit
    supported_response_types:
      - code
      - id_token
    scopes:
      - openid
    require_wallet_binding: false
    qr_code: false
