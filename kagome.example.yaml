# yaml-language-server: $schema=./kagome.schema.json
server:
  address: 0.0.0.0:4000
  issuer: http://localhost:4000
  workers: 4
crypto:
  key_file: kagome.crypto.yaml
tokens:
  access_token_ttl: 3600
  authorization_code_ttl: 600
  id_token_ttl: 3600
  authorization_code_chain_max_depth: 8
clients:
  - client_id: client_id
    public: localhost:4000
    password_file: kagome.htpasswd.example
    client_secret: client_secret
    redirect_uris:
      - https://client.example.com/callback
    supported_grant_types:
      - authorization_code
      - client_credentials
      - code_chain
      - implicit
      - urn:ietf:params:oauth:grant-type:pre-authorized_code
      - password
    supported_response_types:
      - code
      - id_token
      - urn:ietf:params:oauth:response-type:pre-authorized_code
      - token
      - vp_token
    require_wallet_binding: false
    qr_code: false
    federated_server:
      client_id: kagome
      client_secret: federated_client_secret
      authorize_endpoint: https://identity.example.com/authorize
      token_endpoint: https://identity.example.com/token
      endpoints:
        - endpoint: https://identity.example.com/userinfo
          claim: sub
          target: username
