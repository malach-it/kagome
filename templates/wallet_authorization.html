<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>authorization request</title></head><body><main><h1>scan authorization request</h1><figure data-qr-uri="{{ qr_uri }}">{{ qr_svg|safe }}<figcaption>Scan this QR code with your wallet.</figcaption></figure><p><button id="open-wallet" type="button" data-deep-link="{{ authorization_uri }}">open in wallet</button><noscript><a href="{{ authorization_uri }}" target="_blank" rel="noopener noreferrer">open in wallet</a></noscript></p><details><summary>copy deep link</summary><code>{{ authorization_uri }}</code></details></main><script nonce="{{ script_nonce }}">const button=document.getElementById('open-wallet');button.addEventListener('click',()=>window.open(button.dataset.deepLink,'_blank','popup,width=390,height=844,noopener,noreferrer'));</script></body></html>
